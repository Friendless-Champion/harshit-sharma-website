<!doctype html><html lang="en"><head><style id="portfolio-first-paint">
html{background:#0F172A}
.portfolio-loader{display:none}
html.portfolio-loading body{background:linear-gradient(145deg,#0F172A,#17263e)!important;min-height:100dvh}
html.portfolio-loading body>header,html.portfolio-loading body>main,html.portfolio-loading body>footer{visibility:hidden}
html.portfolio-loading .portfolio-loader{display:grid;position:fixed;inset:0;z-index:500;align-content:start;gap:32px;padding:32px 6vw;background:linear-gradient(145deg,#0F172A,#17263e)}
.portfolio-loader-nav{width:min(360px,65%);height:54px;justify-self:end;border-radius:12px}
.portfolio-loader-title{width:min(640px,75%);height:100px;margin-top:100px;border-radius:12px}
.portfolio-loader-copy{width:min(480px,65%);height:22px;border-radius:6px}
.portfolio-loader-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:24px}
.portfolio-loader-card{height:240px;border-radius:16px}
.portfolio-loader-nav,.portfolio-loader-title,.portfolio-loader-copy,.portfolio-loader-card{background:#29374a;animation:portfolio-loading-pulse 1.4s ease-in-out infinite alternate}
@keyframes portfolio-loading-pulse{to{opacity:.55}}
@media(max-width:700px){.portfolio-loader-cards{grid-template-columns:minmax(0,1fr)}.portfolio-loader-title{height:76px;margin-top:64px}.portfolio-loader-card{height:160px}}
@media(prefers-reduced-motion:reduce){.portfolio-loader *{animation:none!important}}
</style>
<script>
document.documentElement.classList.add('portfolio-loading');
document.addEventListener('DOMContentLoaded',()=>{
 const fontReady=document.fonts?document.fonts.ready:Promise.resolve();
 Promise.race([fontReady,new Promise(resolve=>setTimeout(resolve,1600))]).then(()=>{
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   document.documentElement.classList.remove('portfolio-loading');
   document.querySelector('.portfolio-loader')?.remove();
  }));
 });
},{once:true});
